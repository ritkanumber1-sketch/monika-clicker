<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TapMonika — Telegram Mini App</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер приложения -->
    <div class="game-container">
        
        <!-- Шапка: Лиги, Статус и Счёт -->
        <div class="header-info">
            <div class="league-badge">
                <span id="league-icon">🏆</span>
                <span id="league-name">Бронза</span>
            </div>
            <div class="score-board">
                <span class="coin-icon">🪙</span> <span id="score">0</span>
            </div>
        </div>

        <!-- ВКЛАДКА 1: МОНИКА (Главная тапалка) -->
        <div id="tab-monika" class="tab-content active">
            <div class="character-container">
                <button id="tap-button" aria-label="Тапнуть Монику">
                    <!-- Картинка заполнена на всю кнопку от края до края -->
                    <img id="monika-img" src="https://api.iconify.design/lucide:cat.svg?color=%23ffffff" alt="Моника">
                </button>
            </div>

            <!-- Продвинутая шкала энергии -->
            <div class="energy-wrapper">
                <div class="energy-header">
                    <span>⚡ Энергия</span>
                    <span class="energy-text"><span id="energy">1000</span> / <span id="max-energy">1000</span></span>
                </div>
                <div class="energy-bar-container">
                    <div id="energy-bar"></div>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 2: МАГАЗИН И ПРОКАЧКА -->
        <div id="tab-shop" class="tab-content">
            <h2 class="section-title">🛒 Магазин улучшений</h2>
            <div class="shop-list">
                <button id="upgrade-btn" class="action-card">
                    <div class="card-info">
                        <span class="card-title">Сила клика</span>
                        <span class="card-desc">Больше монет за один тап</span>
                    </div>
                    <span class="card-price">🪙 50</span>
                </button>
                <button id="auto-btn" class="action-card">
                    <div class="card-info">
                        <span class="card-title">Авто-фарм</span>
                        <span class="card-desc">Доход каждую секунду</span>
                    </div>
                    <span class="card-price">🪙 200</span>
                </button>
            </div>

            <h3 class="section-subtitle">Скины персонажа</h3>
            <div class="skins-list">
                <button class="skin-btn" data-skin="cat">
                    <span>🐱 Обычный кот</span>
                    <span class="skin-status">Выбрано</span>
                </button>
                <button class="skin-btn" data-skin="crown">
                    <span>👑 Корона</span>
                    <span class="skin-price">500 🪙</span>
                </button>
                <button class="skin-btn" data-skin="rocket">
                    <span>🚀 Ракета</span>
                    <span class="skin-price">1000 🪙</span>
                </button>
            </div>
        </div>

        <!-- ВКЛАДКА 3: ЗАДАНИЯ И СОЦСЕТИ -->
        <div id="tab-tasks" class="tab-content">
            <h2 class="section-title">📋 Задания и Бонусы</h2>
            <div class="shop-list">
                <button id="daily-btn" class="bonus-card">
                    <span>🎁 Ежедневный бонус</span>
                    <span class="card-price">+500 🪙</span>
                </button>
                <button id="ref-btn" class="bonus-card">
                    <span>👥 Пригласить друга</span>
                    <span class="card-price">+400 🪙</span>
                </button>
                
                <h3 class="section-subtitle">Наши соцсети</h3>
                <button class="social-btn" data-social="yt">📺 YouTube: @RockyLenya (+300 🪙)</button>
                <button class="social-btn" data-social="tg">📢 Telegram-канал (+300 🪙)</button>
                <button class="social-btn" data-social="vk">💬 ВКонтакте (+300 🪙)</button>
                <button class="social-btn" data-social="x">🦤 X (Twitter) (+300 🪙)</button>
                <button class="social-btn" data-social="ds">🎮 Discord (+300 🪙)</button>
            </div>
        </div>

        <!-- Контейнер для вылетающих цифр при клике -->
        <div id="floating-text-container"></div>

        <!-- Нижняя панель навигации (Dock) -->
        <nav class="nav-bar">
            <button class="nav-btn active" data-tab="monika">
                <span class="nav-icon">🐾</span>
                <span>Моника</span>
            </button>
            <button class="nav-btn" data-tab="shop">
                <span class="nav-icon">🛒</span>
                <span>Магазин</span>
            </button>
            <button class="nav-btn" data-tab="tasks">
                <span class="nav-icon">📋</span>
                <span>Задания</span>
            </button>
        </nav>

    </div>

    <!-- Подключаем скрипт -->
    <script src="script.js"></script>
</body>
</html>
