<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TapMonika — Кликер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        
        <!-- Шапка -->
        <div class="header-info">
            <div class="league-badge">
                <span id="league-icon">🥉</span>
                <span id="league-name">Бронза</span>
            </div>
            <div class="score-board">🪙 <span id="score">0</span></div>
        </div>

        <!-- Тапалка -->
        <div id="tab-monika" class="tab-content active">
            <div class="character-container">
                <button id="tap-button" aria-label="Тапнуть персонажей">
                    <img id="monika-img" src="https://api.iconify.design/lucide:cat.svg?color=%23ffffff" alt="Персонажи">
                    <span class="button-text">Вилл, Инни и Моника</span>
                </button>
            </div>

            <div class="energy-wrapper">
                <div class="energy-header">
                    <span>⚡ Энергия</span>
                    <span class="energy-text"><span id="energy">1000</span> / <span id="max-energy">1000</span></span>
                </div>
                <div class="energy-bar-container">
                    <div id="energy-bar"></div>
                </div>
            </div>
        </div>

        <!-- Магазин -->
        <div id="tab-shop" class="tab-content">
            <h2 class="section-title">🛒 Магазин улучшений</h2>
            <div class="shop-list">
                <button id="upgrade-btn" class="action-card">
                    <div class="card-info">
                        <span class="card-title">Сила клика (+1)</span>
                        <span class="card-desc">Больше монет за тап</span>
                    </div>
                    <span class="card-price">🪙 50</span>
                </button>
                <button id="auto-btn" class="action-card">
                    <div class="card-info">
                        <span class="card-title">Авто-фарм (+1/сек)</span>
                        <span class="card-desc">Пассивный доход</span>
                    </div>
                    <span class="card-price">🪙 200</span>
                </button>
            </div>

            <h3 class="section-subtitle">Скины</h3>
            <div class="skins-list">
                <button class="skin-btn" data-skin="cat">🐱 Обычный кот</button>
                <button class="skin-btn" data-skin="crown">👑 Корона (500 🪙)</button>
                <button class="skin-btn" data-skin="rocket">🚀 Ракета (1000 🪙)</button>
            </div>
        </div>

        <!-- Задания -->
        <div id="tab-tasks" class="tab-content">
            <h2 class="section-title">📋 Задания и Бонусы</h2>
            <div class="shop-list">
                <button id="daily-btn" class="bonus-card">🎁 Ежедневный бонус (+500 🪙)</button>
                <button id="ref-btn" class="bonus-card">👥 Пригласить друга (+400 🪙)</button>
                
                <h3 class="section-subtitle">Наши соцсети</h3>
                <button class="social-btn" data-social="yt">📺 YouTube: @RockyLenya (+300 🪙)</button>
                <button class="social-btn" data-social="tg">📢 Telegram-канал (+300 🪙)</button>
                <button class="social-btn" data-social="vk">💬 ВКонтакте (+300 🪙)</button>
                <button class="social-btn" data-social="x">🦤 X (Twitter) (+300 🪙)</button>
                <button class="social-btn" data-social="ds">🎮 Discord (+300 🪙)</button>
            </div>
        </div>

        <div id="floating-text-container"></div>

        <!-- Навигация -->
        <nav class="nav-bar">
            <button class="nav-btn active" data-tab="monika">
                <span class="nav-icon">🐾</span>
                <span>Моника</span>
            </button>
            <button class="nav-btn" data-tab="shop">
                <span class="nav-icon">🛒</span>
                <span>Магазин</span>
            </button>
            <button class="nav-btn" data-tab="tasks">
                <span class="nav-icon">📋</span>
                <span>Задания</span>
            </button>
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
