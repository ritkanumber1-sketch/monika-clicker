<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TapMonika — Альбом (24 фото)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
</head>
<body>
    <div class="app-container" id="app-root">
        <header class="header">
            <div class="account-manager-bar">
                <a href="index.html" class="account-action-btn" style="text-decoration:none;">← На главную</a>
                <b style="color:#f472b6;font-size:13px;">📸 Сайт: Альбом</b>
                <span style="font-size:11px;color:#cbd5e1;"><b id="album-unlocked-count">0</b> / 24</span>
            </div>

            <div class="stats-card">
                <div class="score-display">
                    <span>🪙</span>
                    <span id="album-page-score">0</span>
                </div>
                <div class="stats-sub">
                    <span>Открыто фоточек: <b id="album-progress-text">0%</b></span>
                    <button type="button" id="unlock-all-photos-btn" class="account-action-btn">✨ Открыть все (тест)</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title">📸 Альбом пушистиков (24 фото)</h2>
            <p class="section-desc">Все 24 фоточки Монечки, Фортуночки / Фалтуны и Сараби.</p>
            <div class="gallery-grid" id="album-page-grid"></div>
        </main>
    </div>

    <script src="data.js"></script>
    <script>
        const STORAGE_KEY = "tapMonika_profiles_v3";
        const FALLBACK_IMAGES = ["images/monika.jpg", "images/fortune.jpg", "images/sarabi.jpg"];

        let profiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[{"name":"Котёнок №1","score":0,"unlockedPhotos":[0,1],"isNightMode":false}]');
        let p = profiles[0] || { score: 0, unlockedPhotos: [0, 1], isNightMode: false };
        p.unlockedPhotos = Array.isArray(p.unlockedPhotos) ? p.unlockedPhotos : [0, 1];

        document.getElementById("app-root").classList.toggle("night-mode", Boolean(p.isNightMode));

        function saveState() {
            profiles[0] = p;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
        }

        function getSafePhotosList() {
            const base = (typeof galleryPhotos !== "undefined" && Array.isArray(galleryPhotos)) ? galleryPhotos : [];
            const list = [];
            for (let i = 0; i < 24; i++) {
                const item = base[i] || {};
                const fallbackSrc = FALLBACK_IMAGES[i % FALLBACK_IMAGES.length];
                list.push({
                    src: item.src || fallbackSrc,
                    fallback: fallbackSrc,
                    title: item.title || `Пушистик #${i + 1}`,
                    cost: typeof item.cost === "number" ? item.cost : (i + 1) * 150
                });
            }
            return list;
        }

        function renderAlbum() {
            const photos = getSafePhotosList();
            const unlocked = p.unlockedPhotos.length;

            document.getElementById("album-page-score").textContent = Math.floor(p.score || 0).toLocaleString();
            document.getElementById("album-unlocked-count").textContent = unlocked;
            document.getElementById("album-progress-text").textContent = `${Math.min(100, Math.round((unlocked / photos.length) * 100))}%`;

            const grid = document.getElementById("album-page-grid");
            grid.innerHTML = "";

            photos.forEach((photo, idx) => {
                const isOpen = p.unlockedPhotos.includes(idx);
                const box = document.createElement("div");
                box.className = "gallery-item";

                if (isOpen) {
                    const img = document.createElement("img");
                    img.src = photo.src;
                    img.alt = photo.title;
                    img.onerror = function () {
                        if (this.src.endsWith(photo.fallback)) return;
                        this.src = photo.fallback;
                    };
                    box.appendChild(img);
                } else {
                    box.innerHTML = `
                        <div class="gallery-slot-placeholder">
                            <span>🔒 ${photo.cost.toLocaleString()} 🪙</span>
                            <small>${photo.title}</small>
                        </div>
                    `;
                }

                box.addEventListener("click", () => {
                    if (isOpen) {
                        alert(`📸 ${photo.title} открыто!`);
                        return;
                    }
                    if ((p.score || 0) < photo.cost) {
                        alert(`Нужно ${photo.cost.toLocaleString()} 🪙, чтобы открыть «${photo.title}»!`);
                        return;
                    }
                    p.score -= photo.cost;
                    p.unlockedPhotos.push(idx);
                    saveState();
                    renderAlbum();
                });

                grid.appendChild(box);
            });
        }

        document.getElementById("unlock-all-photos-btn").addEventListener("click", () => {
            p.unlockedPhotos = Array.from({ length: 24 }, (_, i) => i);
            saveState();
            renderAlbum();
        });

        renderAlbum();
    </script>
</body>
</html>
